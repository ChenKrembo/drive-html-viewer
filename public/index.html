<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; connect-src https://www.googleapis.com https://accounts.google.com/gsi/; frame-src 'self' https://accounts.google.com/gsi/; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>HTML Viewer for Drive</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="toolbar" id="toolbar" hidden>
      <img class="toolbar-icon" src="icons/icon.svg" alt="" width="20" height="20" />
      <span class="toolbar-title" id="file-name"></span>
      <a class="toolbar-link" id="drive-link" target="_blank" rel="noopener noreferrer" hidden>Open in Drive</a>
      <button class="toolbar-button" id="hide-toolbar" type="button" title="Hide toolbar">Hide</button>
    </header>

    <main class="panel" id="panel">
      <img src="icons/icon.svg" alt="" width="56" height="56" />
      <h1 id="panel-title">HTML Viewer for Drive</h1>
      <p id="panel-message"></p>
      <button class="primary-button" id="panel-action" type="button" hidden></button>
    </main>

    <div class="viewer" id="viewer" hidden></div>
  </body>
</html>
